services:
  stackforge-postgres:
    image: postgres:16-alpine
    container_name: stackforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stackforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-stackforge}
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  stackforge-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stackforge-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      PROJECTS_ROOT: /data/projects
      STACKFORGE_RUNNER_URL: http://stackforge-runner:9000
      STACKFORGE_TEMPLATES_ROOT: /templates
    volumes:
      - ./volumes/projects:/data/projects
      - ./templates:/templates:ro
    depends_on:
      stackforge-postgres:
        condition: service_healthy

  stackforge-runner:
    build:
      context: ./runner
      dockerfile: Dockerfile
    container_name: stackforge-runner
    restart: unless-stopped
    env_file: .env
    environment:
      PROJECTS_ROOT: /data/projects
      PROJECTS_HOST_ROOT: ${PROJECTS_HOST_ROOT:?Set PROJECTS_HOST_ROOT in .env}
      STACKFORGE_RUNNER_TOKEN: ${STACKFORGE_RUNNER_TOKEN:?Set STACKFORGE_RUNNER_TOKEN in .env}
      STACKFORGE_PREVIEW_NETWORK: ${COMPOSE_PROJECT_NAME:-stackforge}_default
    volumes:
      - ./volumes/projects:/data/projects
      - /var/run/docker.sock:/var/run/docker.sock

  stackforge-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: stackforge-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      - stackforge-api

  stackforge-proxy:
    image: caddy:2-alpine
    container_name: stackforge-proxy
    restart: unless-stopped
    environment:
      PREVIEW_BASE_DOMAIN: ${PREVIEW_BASE_DOMAIN_HOST:-192.168.1.180.sslip.io}
    ports:
      - "${STACKFORGE_PROXY_HTTP_PORT:-18181}:80"
      - "${STACKFORGE_PROXY_HTTPS_PORT:-18443}:443"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./volumes/caddy/data:/data
      - ./volumes/caddy/config:/config
    depends_on:
      - stackforge-web
      - stackforge-api
